    <main>
        <h2>My Profile</h2>
        <p>View and update your personal and academic information.</p>
        <form action="#" method="post">
            <fieldset>
                <legend>Personal Information</legend>
                <label for="name">Full Name</label><br>
                <input type="text" id="name" name="name"><br><br>

                <label for="enroll">Enrollment Number</label><br>
                <input type="text" id="enroll" name="enroll"><br><br>

                <label for="email">Email</label><br>
                <input type="email" id="email" name="email"><br><br>

                <label for="mobile">Mobile Number</label><br>
                <input type="tel" id="mobile" name="mobile"><br><br>

                <label for="address">Address</label><br>
                <textarea id="address" name="address" rows="4" cols="35"></textarea>
            </fieldset>
            <br>
            <fieldset>
                <legend>Academic Information</legend>
                <label for="course">Course</label><br>
                <select id="course" name="course">
                    <option>B.Tech CSE</option>
                    <option>B.Tech IT</option>
                    <option>B.Tech CE</option>
                </select><br><br>

                <label for="semester">Semester</label><br>
                <select id="semester" name="semester">
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                    <option>7</option>
                    <option>8</option>
                </select>
            </fieldset>
            <br>
            <input type="submit" value="Update Profile">
            <input type="reset" value="Clear">
        </form>
    </main>
